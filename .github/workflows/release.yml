# Pushing a tag like `phase-3` creates a GitHub Release with the APK attached.
# Download it on a phone from the repository's Releases page.
name: Release

on:
  push:
    tags: ["phase-*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform 37.1
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.1" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Name the APK after the tag
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Jatri-${GITHUB_REF_NAME}-debug.apk"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Jatri ${{ github.ref_name }}"
          files: "Jatri-${{ github.ref_name }}-debug.apk"
          body: |
            Debug build for testing on a phone. It uses the built-in demo backend:
            log in with any valid number (e.g. 01712345678) and OTP **123456**.

            Install: download the APK on the phone, open it and allow "install unknown apps".
            See the README for what's real and what's still sample data in this phase.
