# Creates a GitHub Release with the APK attached, either by pushing a tag like `phase-3`
# or by running this workflow by hand (Actions → Release → Run workflow) with a tag name;
# the run then creates the tag on the chosen commit itself.
name: Release

on:
  push:
    tags: ["phase-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. phase-3"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform 37.1
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.1" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Name the APK after the tag
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Jatri-${TAG}-debug.apk"

      # Play Store bundle: only when the upload key and the API address are configured
      # (Settings → Secrets: JATRI_UPLOAD_KEYSTORE_BASE64, JATRI_KEYSTORE_PASSWORD, JATRI_KEY_ALIAS,
      # JATRI_KEY_PASSWORD; Settings → Variables: JATRI_API_BASE_URL, optional JATRI_CERT_PINS).
      # The bundle is kept as a private workflow artifact, never attached to the public release.
      - name: Signed Play Store bundle (if configured)
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.JATRI_UPLOAD_KEYSTORE_BASE64 }}
          JATRI_KEYSTORE_PASSWORD: ${{ secrets.JATRI_KEYSTORE_PASSWORD }}
          JATRI_KEY_ALIAS: ${{ secrets.JATRI_KEY_ALIAS }}
          JATRI_KEY_PASSWORD: ${{ secrets.JATRI_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.JATRI_API_BASE_URL }}
          CERT_PINS: ${{ vars.JATRI_CERT_PINS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$API_BASE_URL" ]; then
            echo "No upload key or API address configured: skipping the Play Store bundle."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export JATRI_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew :app:bundleRelease -Pjatri.useMockApi=false -Pjatri.apiBaseUrl="$API_BASE_URL" \
            -Pjatri.certPins="$CERT_PINS" -Pjatri.versionCode="${{ github.run_number }}0"
          rm -f "$RUNNER_TEMP/upload.jks"
          echo "AAB_BUILT=1" >> "$GITHUB_ENV"

      - name: Keep the bundle and R8 mapping (private)
        if: env.AAB_BUILT == '1'
        uses: actions/upload-artifact@v4
        with:
          name: jatri-${{ env.TAG }}-play-bundle
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: "Jatri ${{ env.TAG }}"
          files: "Jatri-${{ env.TAG }}-debug.apk"
          body: |
            Debug build for testing on a phone. It uses the built-in demo backend:
            log in with any valid number (e.g. 01712345678) and OTP **123456**.

            Install: download the APK on the phone, open it and allow "install unknown apps".
            See the README for what's real and what's still sample data in this phase.
