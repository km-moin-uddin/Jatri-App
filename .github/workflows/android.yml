# Builds and tests the Android app on every push and pull request.
# The debug APK is attached to the run as an artifact (Checks → this run → Artifacts).
name: Android

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform 37.1
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.1" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit + screenshot tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint (all modules, missing translations are errors)
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jatri-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 14

  # R8 problems only show at run time: build the minified release APK (demo backend), boot an
  # emulator and walk onboarding → guest → Home → bus search → results. Fails on any crash.
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform 37.1
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.1" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build minified release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Sign it with a throwaway key (smoke test only)
        run: |
          keytool -genkeypair -keystore /tmp/smoke.jks -storepass smoketest -keypass smoketest \
            -alias smoke -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Smoke" -noprompt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks /tmp/smoke.jks --ks-pass pass:smoketest \
            --out /tmp/smoke.apk android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 android/scripts/smoke_release.py /tmp/smoke.apk

      - name: Upload the minified APK and mapping on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke
          path: |
            /tmp/smoke.apk
            android/app/build/outputs/mapping/release/
          retention-days: 14
